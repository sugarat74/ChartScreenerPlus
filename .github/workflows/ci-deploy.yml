name: CI & Deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployment security regression checks
        run: bash deploy/verify-security.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt && pytest
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: chartiko-production
      cancel-in-progress: false
    env:
      SSH_DIRECTORY: ${{ runner.temp }}/chartiko-ssh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          bash deploy/configure-ssh.sh "$SSH_DIRECTORY"
      - name: Upload release
        run: |
          REL=${GITHUB_SHA::10}
          ssh -F "$SSH_DIRECTORY/config" chartiko-vps "umask 027; mkdir -p /var/www/alphapulse/releases/$REL"
          rsync -az --delete --chmod=D750,F640 -e "ssh -F '$SSH_DIRECTORY/config'" --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='vendor' --exclude='alphapulse' --exclude='.env' --exclude='*.zip' \
            ./ chartiko-vps:/var/www/alphapulse/releases/$REL/
      - name: Activate release
        run: ssh -F "$SSH_DIRECTORY/config" chartiko-vps "bash /var/www/alphapulse/releases/${GITHUB_SHA::10}/deploy/deploy.sh ${GITHUB_SHA::10}"
      - name: Remove SSH credentials
        if: always()
        run: rm -rf -- "$SSH_DIRECTORY"
