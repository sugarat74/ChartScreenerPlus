name: CI & Deploy
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt && pytest
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload release
        run: |
          REL=${GITHUB_SHA::10}
          ssh deploy@${{ secrets.VPS_HOST }} "mkdir -p /var/www/alphapulse/releases/$REL"
          rsync -az --delete --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='vendor' --exclude='alphapulse' --exclude='.env' --exclude='*.zip' \
            ./ deploy@${{ secrets.VPS_HOST }}:/var/www/alphapulse/releases/$REL/
      - name: Activate release
        run: ssh deploy@${{ secrets.VPS_HOST }} "bash /var/www/alphapulse/releases/${GITHUB_SHA::10}/deploy/deploy.sh ${GITHUB_SHA::10}"
