    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Chartiko","url":"https://www.chartiko.com/","inLanguage":"es","description":"Screener de acciones del S&P 500 con filtros técnicos, candidatos ordenados y gráficos interactivos."}

    <title>Chartiko | Screener de análisis técnico de acciones</title>
    <script>
      // Color theme before the first paint (no flash); same rule as
      // src/theme/theme.ts: the stored choice, else the operating system.
      (function () {
        var theme = null
        try {
          theme = window.localStorage.getItem('chartiko.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <!--

      reuses the classes of AppLayout, AppHeader and the ScreenerPage header so

    -->

            <a href="/como-funciona" class="whitespace-nowrap border-b-2 border-transparent px-4 py-2.5 font-headline text-xs font-bold uppercase tracking-wider text-on-surface-variant">Cómo funciona</a>

        <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6">
