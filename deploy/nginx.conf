map $request_uri $chartiko_robots {
    default "";
    ~^/(screener|chart|instruments|admin|portal|login|register)(/|\?|$) "noindex, follow";
}

server {
    listen 80;
    server_name __SERVER_NAME__;
    root /var/www/alphapulse/current/frontend/dist;
    index index.html;
    add_header X-Robots-Tag $chartiko_robots always;

    # Laravel API + Sanctum
    location ~ ^/(api|sanctum)/ {
        root /var/www/alphapulse/current/public;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/alphapulse/current/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/alphapulse/current/public/index.php;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }
    location ~ /\.(?!well-known) { deny all; }
}
