;; Shared PgBouncer for every project on this VPS. Installed as
;; /etc/pgbouncer/pgbouncer.ini by deploy/install-pgbouncer.sh (root).
;; Projects are registered in /etc/pgbouncer/databases.ini and
;; /etc/pgbouncer/userlist.txt by deploy/postgresql-add-project.sh.
;; Starting sizes; tune from SHOW POOLS evidence (cl_waiting, maxwait).

[pgbouncer]
;; Loopback only: never reachable from the network.
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql

;; Applications authenticate with SCRAM over 127.0.0.1; the admin console is
;; reachable only as the postgres OS user over the Unix socket (peer).
auth_type = hba
auth_hba_file = /etc/pgbouncer/pg_hba.conf
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

;; Laravel is configured for this mode: emulated prepares (pooled `direct`
;; connection config), no session state; migrations go direct to 5432.
pool_mode = transaction
server_reset_query =

max_client_conn = 200
default_pool_size = 10
reserve_pool_size = 2
reserve_pool_timeout = 3
max_db_connections = 20
server_idle_timeout = 600

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

%include /etc/pgbouncer/databases.ini
